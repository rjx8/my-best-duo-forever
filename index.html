<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05060d;
        }

        /* =========================
           شاشة البداية
        ========================= */

        .intro {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1000;

            background:
                radial-gradient(circle at 15% 15%, rgba(72, 42, 120, 0.42), transparent 34%),
                radial-gradient(circle at 85% 80%, rgba(25, 57, 110, 0.38), transparent 38%),
                radial-gradient(circle at 50% 50%, rgba(50, 34, 88, 0.16), transparent 55%),
                linear-gradient(135deg, #05060d 0%, #090d20 32%, #11102c 55%, #0b1024 75%, #05060d 100%);

            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .intro::after {
            content: "";
            position: absolute;
            inset: 16px;
            border: 1px solid rgba(135, 108, 210, 0.42);
            border-radius: 24px;
            box-shadow:
                0 0 25px rgba(94, 62, 150, 0.18),
                inset 0 0 35px rgba(60, 45, 110, 0.08);
            pointer-events: none;
            z-index: 100;
        }

        .intro::before {
            content: "";
            position: absolute;
            width: 70vw;
            height: 70vw;
            max-width: 700px;
            max-height: 700px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(86, 56, 145, 0.13),
                transparent 65%
            );
            filter: blur(35px);
            animation: glow 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes glow {
            from {
                transform: translate(-55%, -50%) scale(0.9);
            }

            to {
                transform: translate(-45%, -50%) scale(1.12);
            }
        }

        .stickers {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        .sticker-container {
            position: absolute;
            width: var(--size);
            height: var(--size);
            opacity: 0;
            transform: translate(-50%, -50%);
            animation:
                stickerPop 0.65s cubic-bezier(0.22, 1.15, 0.36, 1) forwards;
            will-change: transform, opacity;
        }

        .sticker {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            user-select: none;
            filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.5));
            animation: stickerFloat var(--duration) ease-in-out infinite;
            animation-delay: var(--float-delay);
            will-change: transform;
        }

        @keyframes stickerPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.15) rotate(-8deg);
            }

            55% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.06) rotate(2deg);
            }

            78% {
                transform: translate(-50%, -50%) scale(0.98) rotate(-1deg);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
        }

        @keyframes stickerFloat {
            0% {
                transform: translate3d(0, 0, 0) rotate(-2deg);
            }

            50% {
                transform: translate3d(5px, -9px, 0) rotate(2deg);
            }

            100% {
                transform: translate3d(0, 0, 0) rotate(-2deg);
            }
        }

        .content {
            position: relative;
            z-index: 50;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .intro-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
            font-size: clamp(13px, 3vw, 17px);
            font-weight: 500;
            letter-spacing: 3px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9);
            opacity: 0;
            animation: textAppear 0.9s ease 1.3s forwards;
        }

        @keyframes textAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        .intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* =========================
           شاشة الهدية
        ========================= */

        .gift-screen {
            position: fixed;
            inset: 0;
            z-index: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(70, 70, 80, 0.16),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #16171b 0%,
                    #101115 45%,
                    #08090c 100%
                );

            color: white;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            overflow: hidden;
            padding: 34px 20px 0;
        }

        /* إطار الشاشة */
        .gift-screen::before {
            content: "";
            position: absolute;
            inset: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            pointer-events: none;
        }

        /* =========================
           منطقة الصورة
        ========================= */

        .scratch-wrapper {
            position: relative;

            width: min(86vw, 390px);
            aspect-ratio: 1 / 1;

            margin-top: 5vh;

            border-radius: 18px;
            overflow: hidden;

            background: #111217;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.08);

            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* الصورة الأصلية */
        .gift-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;

            filter: blur(18px);
            transform: scale(1.04);

            transition:
                filter 0.8s ease,
                transform 0.8s ease;
        }

        /* عند اكتمال المسح */
        .scratch-wrapper.revealed .gift-image {
            filter: blur(0);
            transform: scale(1);
        }

        /* Canvas الخاص بالمسح */
        #scratchCanvas {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            cursor: crosshair;

            touch-action: none;
        }

        /* طبقة المسح */
        .scratch-cover {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(115, 116, 123, 0.96),
                    rgba(55, 56, 62, 0.97)
                );

            display: flex;
            align-items: center;
            justify-content: center;

            transition: opacity 0.7s ease;
        }

        .scratch-cover span {
            color: rgba(255, 255, 255, 0.78);
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);

            animation: scratchHint 1.7s ease-in-out infinite;
        }

        @keyframes scratchHint {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 1;
            }
        }

        .scratch-wrapper.revealed .scratch-cover {
            opacity: 0;
        }

        /* =========================
           الأزرار
        ========================= */

        .actions {
            width: min(86vw, 390px);

            display: flex;
            gap: 10px;

            margin-top: 18px;

            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;

            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }

        .actions.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .action-button {
            flex: 1;

            height: 48px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 13px;

            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.92);

            font-family: inherit;
            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .action-button:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }

        /* =========================
           النص + IMG_7293
        ========================= */

        .gift-message {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 18px;

            color: rgba(255, 255, 255, 0.82);

            font-size: 14px;
            font-weight: 400;

            opacity: 0;
            transform: translateY(8px);

            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }

        .gift-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .gift-message img {
            width: 25px;
            height: 25px;

            object-fit: contain;

            filter:
                drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
        }

        /* =========================
           IMG_7294 أسفل الشاشة
        ========================= */

        .bottom-image {
            position: absolute;

            bottom: 18px;

            width: 105px;
            height: 105px;

            object-fit: contain;

            filter:
                drop-shadow(0 10px 20px rgba(0, 0, 0, 0.55));

            pointer-events: none;

            animation: bottomFloat 4s ease-in-out infinite;
        }

        @keyframes bottomFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* =========================
           الجوال
        ========================= */

        @media (max-width: 600px) {
            .intro::after {
                inset: 12px;
                border-radius: 18px;
            }

            .gift-screen {
                padding-top: 20px;
            }

            .scratch-wrapper {
                margin-top: 4vh;
                width: min(86vw, 360px);
            }

            .bottom-image {
                bottom: 12px;
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         شاشة البداية
    ========================= -->

    <div class="intro" id="intro">

        <div class="stickers" id="stickers"></div>

        <div class="content">
            <div class="intro-text">TAP ANYWHERE</div>
        </div>

    </div>


    <!-- =========================
         شاشة الهدية
    ========================= -->

    <main class="gift-screen" id="giftScreen">

        <!-- مربع الصورة -->
        <div class="scratch-wrapper" id="scratchWrapper">

            <img
                src="iii.jpeg"
                class="gift-image"
                id="giftImage"
                alt="Gift"
            >

            <canvas id="scratchCanvas"></canvas>

            <div class="scratch-cover">
                <span>امسح للكشف عن الهدية</span>
            </div>

        </div>


        <!-- الأزرار -->
        <div class="actions" id="actions">

            <button
                class="action-button"
                id="saveImage"
                type="button"
            >
                حفظ بمعرض الصور
            </button>

            <button
                class="action-button"
                id="savePdf"
                type="button"
            >
                حفظ كملف PDF
            </button>

        </div>


        <!-- الرسالة -->
        <div class="gift-message" id="giftMessage">

            <span>هدية بسيطة مني</span>

            <img
                src="IMG_7293.png"
                alt=""
            >

        </div>


        <!-- الصورة السفلية -->
        <img
            src="IMG_7294.png"
            class="bottom-image"
            alt=""
        >

    </main>


    <script>

        /* =====================================================
           شاشة البداية - نفس الكود الأساسي
        ===================================================== */

        const intro = document.getElementById("intro");
        const stickers = document.getElementById("stickers");

        const image = "IMG_7293.png";

        const amount = window.innerWidth < 600 ? 18 : 24;

        const positions = [
            [6, 8], [28, 7], [52, 8], [76, 8], [91, 17],
            [7, 30], [24, 25], [77, 27], [93, 34],
            [5, 53], [22, 73], [78, 72], [94, 55],
            [7, 82], [29, 90], [52, 88], [76, 90], [93, 81],
            [15, 57], [86, 59], [38, 10], [64, 11], [38, 88], [63, 87]
        ];

        const shuffled = [...positions].sort(
            () => Math.random() - 0.5
        );

        for (
            let i = 0;
            i < Math.min(amount, shuffled.length);
            i++
        ) {

            const container = document.createElement("div");

            container.className = "sticker-container";

            const sticker = document.createElement("img");

            sticker.src = image;
            sticker.className = "sticker";
            sticker.alt = "Gift sticker";

            const [x, y] = shuffled[i];

            container.style.left = `${x}%`;
            container.style.top = `${y}%`;

            const size = 65 + Math.random() * 35;

            container.style.setProperty(
                "--size",
                `${size}px`
            );

            const duration = 4 + Math.random() * 3;

            sticker.style.setProperty(
                "--duration",
                `${duration}s`
            );

            sticker.style.setProperty(
                "--float-delay",
                `${Math.random() * 2}s`
            );

            container.style.animationDelay =
                `${i * 0.08}s`;

            container.appendChild(sticker);

            stickers.appendChild(container);
        }


        /* =====================================================
           الانتقال لشاشة الهدية
        ===================================================== */

        const handleDismiss = () => {

            intro.classList.add("hide");

            setTimeout(() => {

                intro.style.display = "none";

                startScratch();

            }, 800);

        };

        intro.addEventListener(
            "pointerdown",
            handleDismiss,
            { once: true }
        );


        /* =====================================================
           نظام المسح
        ===================================================== */

        const canvas =
            document.getElementById("scratchCanvas");

        const ctx =
            canvas.getContext("2d", {
                willReadFrequently: true
            });

        const scratchWrapper =
            document.getElementById("scratchWrapper");

        const actions =
            document.getElementById("actions");

        const giftMessage =
            document.getElementById("giftMessage");

        let isDrawing = false;

        let revealed = false;

        let scratchedPoints = 0;

        let lastX = 0;
        let lastY = 0;


        function startScratch() {

            resizeCanvas();

            window.addEventListener(
                "resize",
                resizeCanvas
            );

        }


        function resizeCanvas() {

            const rect =
                scratchWrapper.getBoundingClientRect();

            const dpr =
                Math.min(window.devicePixelRatio || 1, 2);

            canvas.width =
                Math.round(rect.width * dpr);

            canvas.height =
                Math.round(rect.height * dpr);

            canvas.style.width =
                `${rect.width}px`;

            canvas.style.height =
                `${rect.height}px`;

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

            /*
             * طبقة رمادية فوق الصورة
             */
            ctx.globalCompositeOperation =
                "source-over";

            const gradient =
                ctx.createLinearGradient(
                    0,
                    0,
                    rect.width,
                    rect.height
                );

            gradient.addColorStop(
                0,
                "rgba(120,121,128,0.98)"
            );

            gradient.addColorStop(
                0.5,
                "rgba(75,76,83,0.98)"
            );

            gradient.addColorStop(
                1,
                "rgba(48,49,55,0.98)"
            );

            ctx.fillStyle = gradient;

            ctx.fillRect(
                0,
                0,
                rect.width,
                rect.height
            );

            /*
             * نضيف لمعة خفيفة
             */
            ctx.globalAlpha = 0.12;

            ctx.fillStyle = "#ffffff";

            ctx.beginPath();

            for (
                let i = 0;
                i < 100;
                i++
            ) {

                const x =
                    Math.random() * rect.width;

                const y =
                    Math.random() * rect.height;

                ctx.arc(
                    x,
                    y,
                    1.5,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            ctx.globalAlpha = 1;
        }


        function getPosition(event) {

            const rect =
                canvas.getBoundingClientRect();

            let clientX;
            let clientY;

            if (event.touches) {

                clientX =
                    event.touches[0].clientX;

                clientY =
                    event.touches[0].clientY;

            } else {

                clientX =
                    event.clientX;

                clientY =
                    event.clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };

        }


        function scratch(event) {

            if (revealed) return;

            event.preventDefault();

            const {
                x,
                y
            } = getPosition(event);

            ctx.globalCompositeOperation =
                "destination-out";

            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            /*
             * حجم منطقة المسح
             */
            const brushSize =
                window.innerWidth < 600
                    ? 48
                    : 58;

            ctx.lineWidth = brushSize;

            /*
             * خط ناعم بين النقاط
             */
            if (lastX === 0 && lastY === 0) {

                lastX = x;
                lastY = y;

            }

            ctx.beginPath();

            ctx.moveTo(
                lastX,
                lastY
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.stroke();

            /*
             * دائرة عند الإصبع
             */
            ctx.beginPath();

            ctx.arc(
                x,
                y,
                brushSize / 2,
                0,
                Math.PI * 2
            );

            ctx.fill();

            lastX = x;
            lastY = y;

            scratchedPoints++;

            /*
             * نفحص نسبة المسح كل عدة حركات
             */
            if (scratchedPoints % 8 === 0) {
                checkReveal();
            }

        }


        function stopScratch() {

            isDrawing = false;

            lastX = 0;
            lastY = 0;

            checkReveal();

        }


        function checkReveal() {

            if (revealed) return;

            const width =
                canvas.width;

            const height =
                canvas.height;

            /*
             * نصغر الفحص حتى يكون خفيفًا على الجوال
             */
            const sampleSize = 40;

            const tempCanvas =
                document.createElement("canvas");

            tempCanvas.width =
                sampleSize;

            tempCanvas.height =
                sampleSize;

            const tempCtx =
                tempCanvas.getContext("2d");

            tempCtx.drawImage(
                canvas,
                0,
                0,
                sampleSize,
                sampleSize
            );

            const pixels =
                tempCtx.getImageData(
                    0,
                    0,
                    sampleSize,
                    sampleSize
                ).data;

            let transparent = 0;
            let total = 0;

            for (
                let i = 3;
                i < pixels.length;
                i += 4
            ) {

                total++;

                if (pixels[i] < 40) {
                    transparent++;
                }

            }

            const percentage =
                transparent / total;

            /*
             * عند مسح 78% من الصورة
             * نعتبرها مكتشفة بالكامل
             */
            if (percentage >= 0.78) {

                revealGift();

            }

        }


        function revealGift() {

            if (revealed) return;

            revealed = true;

            /*
             * نحذف طبقة المسح
             */
            canvas.style.transition =
                "opacity 0.5s ease";

            canvas.style.opacity = "0";

            scratchWrapper.classList.add(
                "revealed"
            );

            setTimeout(() => {

                actions.classList.add("show");

                giftMessage.classList.add("show");

            }, 350);

        }


        /* =====================================================
           أحداث اللمس والماوس
        ===================================================== */

        canvas.addEventListener(
            "pointerdown",
            event => {

                if (revealed) return;

                isDrawing = true;

                canvas.setPointerCapture(
                    event.pointerId
                );

                scratch(event);

            }
        );

        canvas.addEventListener(
            "pointermove",
            event => {

                if (!isDrawing) return;

                scratch(event);

            }
        );

        canvas.addEventListener(
            "pointerup",
            stopScratch
        );

        canvas.addEventListener(
            "pointercancel",
            stopScratch
        );


        /* =====================================================
           حفظ الصورة
        ===================================================== */

        const saveImage =
            document.getElementById("saveImage");

        saveImage.addEventListener(
            "click",
            async () => {

                if (!revealed) return;

                const img =
                    document.getElementById("giftImage");

                try {

                    const response =
                        await fetch(img.src);

                    const blob =
                        await response.blob();

                    const url =
                        URL.createObjectURL(blob);

                    const link =
                        document.createElement("a");

                    link.href = url;

                    link.download =
                        "my-gift.jpeg";

                    document.body.appendChild(link);

                    link.click();

                    link.remove();

                    URL.revokeObjectURL(url);

                } catch (error) {

                    /*
                     * إذا لم يسمح المتصفح بالتنزيل
                     * نفتح الصورة مباشرة.
                     */
                    window.open(
                        img.src,
                        "_blank"
                    );

                }

            }
        );


        /* =====================================================
           حفظ PDF
        ===================================================== */

        const savePdf =
            document.getElementById("savePdf");

        savePdf.addEventListener(
            "click",
            () => {

                if (!revealed) return;

                const img =
                    document.getElementById("giftImage");

                /*
                 * نفتح صفحة جاهزة للطباعة كـ PDF.
                 * من الجوال يستطيع المستخدم اختيار
                 * "حفظ في الملفات" كملف PDF.
                 */
                const printWindow =
                    window.open(
                        "",
                        "_blank"
                    );

                if (!printWindow) return;

                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html lang="ar">
                    <head>
                        <meta charset="UTF-8">
                        <title>هدية</title>

                        <style>

                            * {
                                box-sizing: border-box;
                            }

                            html,
                            body {
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                min-height: 100%;
                                background: #ffffff;
                            }

                            body {
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                padding: 30px;
                            }

                            img {
                                max-width: 100%;
                                max-height: 90vh;
                                object-fit: contain;
                            }

                            @media print {

                                body {
                                    padding: 0;
                                }

                                img {
                                    width: 100%;
                                    max-height: none;
                                }

                            }

                        </style>

                    </head>

                    <body>

                        <img
                            src="${img.src}"
                            alt="Gift"
                        >

                        <script>

                            window.onload = function() {

                                setTimeout(
                                    function() {
                                        window.print();
                                    },
                                    500
                                );

                            };

                        <\/script>

                    </body>
                    </html>
                `);

                printWindow.document.close();

            }
